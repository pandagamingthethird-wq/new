name: Build - CFRP (CyberRecoveryProject as the recovery)

# Same structure as a normal TWRP builder (repo sync -> clone device tree
# -> lunch -> make), but bootable/recovery is REPLACED with
# CyberRecoveryProject's source, so the recovery that gets built is CFRP,
# not TWRP. Lives in your DEVICE TREE repo (.github/workflows/).
#
# NOT YET BUILD-TESTED: this needs a real AOSP-tree build that can't be
# run in the sandbox this was written in. Expect to iterate on the first
# few runs.

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Minimal-Manifest Branch (provides the AOSP build tree only; its TWRP recovery gets replaced)'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-12.1
        - twrp-11
        - twrp-9.0
        - twrp-8.1
      CFRP_REPO:
        description: 'CyberRecoveryProject repo URL'
        required: true
        default: 'https://github.com/pandagamingthethird-wq/CyberRecoveryProject'
      CFRP_BRANCH:
        description: 'CyberRecoveryProject branch'
        required: true
        default: 'Newww'
      DEVICE_TREE:
        description: 'Device Tree repo URL'
        required: true
        default: 'https://github.com/pandagamingthethird-wq/new'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device path - must match DEVICE_PATH in BoardConfig.mk exactly'
        required: true
        default: 'device/tecno/TECNO-BF7'
      DEVICE_NAME:
        description: 'Device codename - must match PRODUCT_DEVICE exactly'
        required: true
        default: 'BF7'
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    name: Build CFRP by ${{ github.actor }}
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v6

    - name: Display Inputs
      run: |
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "CFRP: ${{ github.event.inputs.CFRP_REPO }} @ ${{ github.event.inputs.CFRP_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }} @ ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}image"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      id: manifest
      run: |
         if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "twrp-11" || "${{ github.event.inputs.MANIFEST_BRANCH }}" == "twrp-12.1" ]]; then
           echo "value=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" >> "$GITHUB_OUTPUT"
         else
           echo "value=https://github.com/sounddrill31/platform_manifest_twrp_omni.git" >> "$GITHUB_OUTPUT"
         fi

    - name: Initialize Repo
      run: |
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        sed -i '/<remove-project name="platform\/external\/gflags"  \/>/d' .repo/manifests/remove-minimal.xml

    - name: Repo Sync
      run: |
        cd android-recovery
        repo sync -j$(nproc --all) --force-sync

    - name: Replace bootable/recovery with CFRP
      run: |
        cd android-recovery
        rm -rf bootable/recovery
        git clone --depth=1 ${{ github.event.inputs.CFRP_REPO }} -b ${{ github.event.inputs.CFRP_BRANCH }} bootable/recovery
        if [ ! -f bootable/recovery/Android.mk ]; then
          echo "::error::CFRP has no Android.mk at its root, so the AOSP build can't compile it. Add the Android.mk from this reply to the CFRP repo first."
          exit 1
        fi
        echo "CFRP_COMMIT=$(git -C bootable/recovery rev-parse HEAD)" >> $GITHUB_ENV

    - name: Clone Device Tree
      run: |
        cd android-recovery
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Build Makefile
      run: |
        cd android-recovery
        for prefix in cfrp twrp omni; do
          if [ -f ${{ github.event.inputs.DEVICE_PATH }}/${prefix}_${{ github.event.inputs.DEVICE_NAME }}.mk ]; then
            echo "DEVICE_MAKEFILE=${prefix}_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
            exit 0
          fi
        done
        echo "::error::No cfrp_/twrp_/omni_${{ github.event.inputs.DEVICE_NAME }}.mk at ${{ github.event.inputs.DEVICE_PATH }} - DEVICE_PATH/DEVICE_NAME don't match your tree."
        exit 1

    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1'
      run: |
        sudo apt -y install python
        sudo rm -rf /usr/bin/python
        sudo ln -s /usr/bin/python2 /usr/bin/python

    - name: Building Image
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.DEVICE_MAKEFILE }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

    - name: Upload to Release (boot and recovery)
      if: github.event.inputs.BUILD_TARGET == 'boot' || github.event.inputs.BUILD_TARGET == 'recovery'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
        name: CFRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Recovery: CyberRecoveryProject @ ${{ env.CFRP_COMMIT }}
          Device tree: ${{ github.event.inputs.DEVICE_TREE }} @ ${{ env.COMMIT_ID }}

    - name: Upload to Release (if vendor_boot)
      if: github.event.inputs.BUILD_TARGET == 'vendorboot'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
        name: CFRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Recovery: CyberRecoveryProject @ ${{ env.CFRP_COMMIT }}
          Device tree: ${{ github.event.inputs.DEVICE_TREE }} @ ${{ env.COMMIT_ID }}
